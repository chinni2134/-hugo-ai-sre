services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: hugo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: hugo
      POSTGRES_PASSWORD: hugo_password
      POSTGRES_DB: hugo

    ports:
      - "5433:5432"

    volumes:
      - hugo_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugo -d hugo"]
      interval: 5s
      timeout: 5s
      retries: 5


  neo4j:
    image: neo4j:5
    container_name: hugo-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/hugo_password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - hugo_neo4j_data:/data
      - hugo_neo4j_logs:/logs


volumes:

  hugo_postgres_data:
  hugo_neo4j_data:
  hugo_neo4j_logs:
